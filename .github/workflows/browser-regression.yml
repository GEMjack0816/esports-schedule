name: Browser regression checks

on:
  pull_request:
    paths:
      - "src/app/globals.css"
      - "scripts/verify-browser.mjs"
      - ".github/workflows/browser-regression.yml"
  push:
    branches:
      - main
    paths:
      - "src/app/globals.css"
      - "scripts/verify-browser.mjs"
      - ".github/workflows/browser-regression.yml"

permissions:
  contents: read

concurrency:
  group: browser-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Desktop and 390px browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright-core install --with-deps chromium

      - name: Build the production app
        run: npm run build

      - name: Start the isolated local app
        shell: bash
        run: |
          env -u DATABASE_URL -u PANDASCORE_TOKEN -u CRON_SECRET \
            npm start -- --hostname 127.0.0.1 --port 3000 > /tmp/esports-schedule-browser.log 2>&1 &
          server_pid=$!
          echo "$server_pid" > /tmp/esports-schedule-browser.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/version > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/esports-schedule-browser.log
          exit 1

      - name: Verify desktop and 390px browser behavior
        run: npm run verify:browser -- http://127.0.0.1:3000

      - name: Stop the isolated local app
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/esports-schedule-browser.pid ]; then
            kill "$(cat /tmp/esports-schedule-browser.pid)" 2>/dev/null || true
          fi

name: Check schedule freshness

on:
  schedule:
    # Keep a 15-minute cadence, offset from quarter-hour boundaries (especially :00).
    - cron: "12,27,42,57 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schedule-freshness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out monitor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Verify public schedule freshness
        run: npm run monitor:schedule-freshness

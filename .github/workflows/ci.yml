name: Code quality and tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: TypeScript, lint, tests, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      DATABASE_URL: postgresql://ci_user:ci_password@127.0.0.1:5432/esports_schedule_ci
      REVIEW_TEST_DATABASE_URL: postgresql://ci_user:ci_password@127.0.0.1:5432/esports_schedule_ci
      ALLOW_REVIEW_DATABASE_TESTS: "1"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: esports_schedule_ci
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d esports_schedule_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply schema to the isolated PostgreSQL service
        run: npm run db:migrate

      - name: Verify isolated database schema
        run: npm run db:check

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest including PostgreSQL integration tests
        run: npm test

      - name: Build the production bundle
        run: npm run build

      - name: Scan client assets for server credentials
        run: npm run test:client-bundle

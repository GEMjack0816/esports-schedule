name: Code quality and tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: TypeScript, lint, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      DATABASE_URL: postgresql://ci_user:ci_password@127.0.0.1:5432/esports_schedule_ci
      REVIEW_TEST_DATABASE_URL: postgresql://ci_user:ci_password@127.0.0.1:5432/esports_schedule_ci
      ALLOW_REVIEW_DATABASE_TESTS: "1"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: esports_schedule_ci
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d esports_schedule_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply schema to the isolated PostgreSQL service
        run: npm run db:migrate

      - name: Verify isolated database schema
        run: npm run db:check

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest including PostgreSQL integration tests
        run: npm test

      - name: Build the production bundle
        run: npm run build

      - name: Install Chromium for the logo fault-injection regression
        run: npx playwright-core install --with-deps chromium

      - name: Run logo retry and fallback regression against the local build
        run: |
          set -euo pipefail
          npm start -- --port 3105 > "$RUNNER_TEMP/logo-test-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3105/api/version >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          npm run verify:logo-fallback -- http://127.0.0.1:3105

      - name: Scan client assets for server credentials
        run: npm run test:client-bundle

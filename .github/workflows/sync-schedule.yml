name: Sync esports fixtures

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: esports-schedule-production-sync
  cancel-in-progress: false

jobs:
  refresh:
    # workflow_dispatch can target a non-default ref; only main may use the production sync credential.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out response validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trigger the protected production sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          node scripts/trigger-sync.mjs

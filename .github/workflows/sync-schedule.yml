name: Sync esports fixtures

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: esports-schedule-production-sync
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out response validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trigger the protected production sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SYNC_URL: https://esports-schedule-two.vercel.app/api/cron/sync
        run: |
          test -n "$CRON_SECRET"
          response_file="$RUNNER_TEMP/sync-response.json"
          http_status=$(curl --silent --show-error \
            --retry 2 --retry-all-errors --max-time 300 \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$SYNC_URL")
          node scripts/validate-sync-response.mjs "$response_file" "$http_status"
